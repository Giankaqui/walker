# Especialista en tramos 4-5 con RELEVO TARDÍO: SAC conduce una maratón hardcore/hc-plus hasta ~125-150 m (odometría)
# y PPO aprende desde ahí (para el agente con cambio tardío, D_SW ~140). Ver training/relevo.py.
extends: ppo_ft_hard.yaml
name: ppo_rt_xa
seed: 141
n_envs: 3
init_from: init_xall3
algo_kwargs:
  learning_rate: 0.00003
  target_kl: 0.01
stages:
  - name: relevo_tardio
    timesteps: 81524948
    envs:
      - {profile: relevo_t_hcp, length: 240, max_steps: 6000, weight: 4}
      - {profile: relevo_t_hc,  length: 240, max_steps: 6000, weight: 3}
      - {profile: huecos,  difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 1}
      - {profile: bloques, difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 1}
