# Especialista hardcore CON RELEVO: SAC + detector (agente/) conducen hasta el cambio y PPO aprende desde ahí
# (misma distribución de estados que en la carrera real del agente híbrido). Ver training/relevo.py.
extends: ppo_ft_hard.yaml
name: ppo_rl_xa
seed: 131
n_envs: 3
init_from: init_xall3
algo_kwargs:
  learning_rate: 0.00003
  target_kl: 0.01
stages:
  - name: relevo
    timesteps: 81524948
    envs:
      - {profile: relevo_hcp, length: 240, max_steps: 6000, weight: 4}
      - {profile: relevo_hc,  length: 240, max_steps: 6000, weight: 3}
      - {profile: huecos,  difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 1}
      - {profile: bloques, difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 1}
