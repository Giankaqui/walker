# Especialista en hardcore: afina sac_max (init_from) con currículo cargado a maraton hardcore/hardcore-plus.
# Motivación (medido con training/herramientas/holdout.py del PR #1, 80 carreras públicas+nuevas):
# sac_max domina pistas normales (18/20, 9/10) pero rinde mal en hardcore/hardcore-plus (1-2/20).
# Mismos algo_kwargs que sac_max (misma arquitectura/UTD, ya calibrados en esta GPU); learning_rate más bajo
# y learning_starts corto porque se arranca desde una política ya buena, no desde cero.
extends: sac_max.yaml
name: sac_hardcore
seed: 2
init_from: sac_max   # <LAB4_RUNS_DIR>/sac_max/best/{model.zip,obs_rms.pkl}
time_limit_hours: 24
algo_kwargs:
  learning_rate: 0.0001
  learning_starts: 2000   # el modelo ya es bueno: no desperdiciar pasos en acciones aleatorias

stages:
  - name: afinado_hardcore
    timesteps: 10000000
    envs:
      - {profile: maraton, difficulty: hardcore-plus, length: 240, max_steps: 6000, weight: 4}
      - {profile: maraton, difficulty: hardcore,      length: 240, max_steps: 6000, weight: 3}
      - {profile: huecos,    difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 2}
      - {profile: bloques,   difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 2}
      - {profile: escalones, difficulty: hardcore-plus, length: 40, max_steps: 1200, weight: 1}
      - {profile: mixto,     difficulty: hardcore-plus, length: 80, max_steps: 2400, weight: 1}
      - {profile: maraton, length: 240, max_steps: 6000, weight: 1}   # ancla: no olvidar lo normal
